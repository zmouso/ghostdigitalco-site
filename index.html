<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Ghost Digital Co — premium websites for local service businesses. Based in Knoxville, TN. Built in 7 days."/>
  <title>Ghost Digital Co | Websites for Local Service Businesses</title>
  <style>
    :root{
      --black:#050810;
      --dark:#0A0F1A;
      --steel:#111827;
      --blue:#2563EB;
      --blue-bright:#3B82F6;
      --blue-glow:#60A5FA;
      --silver:#94A3B8;
      --muted:#475569;
      --light:#F1F5F9;
      --gray:#1E293B;
      --white:#FFFFFF;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--white);color:var(--gray);overflow-x:hidden}

    nav{position:fixed;top:0;left:0;right:0;z-index:200;height:70px;background:rgba(5,8,16,.97);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid rgba(37,99,235,.3)}
    .nav-logo{text-decoration:none;display:flex;align-items:center;gap:10px}
    .nm{font-size:22px;font-weight:900;letter-spacing:6px;color:var(--white);text-transform:uppercase}
    .ns{width:6px;height:6px;background:var(--blue-bright);border-radius:50%;box-shadow:0 0 8px var(--blue-bright);animation:pulse 2s infinite}
    .nd{font-size:10px;font-weight:400;letter-spacing:5px;color:var(--muted);text-transform:uppercase}
    @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px var(--blue-bright)}50%{opacity:.6;box-shadow:0 0 16px var(--blue-bright)}}
    .nav-links{display:flex;gap:36px;list-style:none;align-items:center}
    .nav-links a{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--silver);text-decoration:none;transition:color .2s}
    .nav-links a:hover{color:var(--blue-glow)}
    .ncta{background:var(--blue)!important;color:var(--white)!important;padding:10px 26px;transition:all .2s!important;box-shadow:0 0 20px rgba(37,99,235,.4)}
    .ncta:hover{background:var(--blue-bright)!important;box-shadow:0 0 30px rgba(59,130,246,.6)!important}
    .nav-mobile-cta{display:none;background:var(--blue);color:var(--white);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 20px;text-decoration:none}

    #home{min-height:100vh;background:var(--black);display:flex;align-items:center;padding-top:70px;position:relative;overflow:hidden}
    .hgb{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.06) 1px,transparent 1px);background-size:60px 60px}
    .hgb2{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.03) 1px,transparent 1px);background-size:12px 12px}
    .hgl{position:absolute;right:-10%;top:50%;transform:translateY(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(37,99,235,.18) 0%,transparent 60%);pointer-events:none;animation:glow 6s ease-in-out infinite}
    .hgl2{position:absolute;left:-5%;bottom:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.1) 0%,transparent 65%);pointer-events:none}
    @keyframes glow{0%,100%{opacity:.8;transform:translateY(-50%) scale(1)}50%{opacity:1;transform:translateY(-52%) scale(1.05)}}
    .hi{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:100px 48px;width:100%}
    .hew{display:inline-flex;align-items:center;gap:14px;margin-bottom:36px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.25);padding:8px 18px}
    .hel{width:20px;height:2px;background:var(--blue-bright)}
    .hew span{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--blue-glow)}
    #home h1{font-size:clamp(56px,9vw,118px);font-weight:900;line-height:.88;color:var(--white);letter-spacing:-2px;text-transform:uppercase;margin-bottom:40px}
    #home h1 em{font-style:normal;display:block;background:linear-gradient(135deg,var(--blue-bright) 0%,var(--blue-glow) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hsub{font-size:18px;font-weight:300;color:var(--silver);max-width:520px;line-height:1.8;margin-bottom:52px;padding-left:20px;border-left:2px solid var(--blue-bright)}
    .hbtns{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:80px}
    .btn-blue{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:var(--white);font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:18px 44px;text-decoration:none;transition:all .25s;box-shadow:0 4px 24px rgba(37,99,235,.5)}
    .btn-blue:hover{background:var(--blue-bright);transform:translateY(-3px);box-shadow:0 8px 32px rgba(59,130,246,.6)}
    .btn-out{display:inline-flex;align-items:center;background:transparent;color:var(--white);font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:18px 44px;border:1px solid rgba(148,163,184,.25);text-decoration:none;transition:all .25s}
    .btn-out:hover{border-color:var(--blue-bright);color:var(--blue-glow);transform:translateY(-3px)}
    .hproof{display:grid;grid-template-columns:repeat(4,auto);gap:1px;background:rgba(37,99,235,.15);width:fit-content}
    .pi{background:rgba(5,8,16,.8);padding:24px 36px;text-align:center}
    .pn{font-size:36px;font-weight:900;color:var(--white);line-height:1;margin-bottom:4px}
    .pn-blue{color:var(--blue-bright)}
    .pl{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}

    .mq{background:var(--steel);overflow:hidden;white-space:nowrap;border-top:1px solid rgba(37,99,235,.2);border-bottom:1px solid rgba(37,99,235,.2)}
    .mq-inner{display:flex;align-items:center;height:48px}
    .mqi{display:inline-flex;align-items:center;animation:mqanim 32s linear infinite}
    .mqt{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--silver);padding:0 32px}
    .mqs{color:var(--blue-bright);font-size:14px}
    @keyframes mqanim{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    .sec{padding:120px 48px}
    .con{max-width:1200px;margin:0 auto}
    .ey{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--blue-bright);margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .ey::before{content:'';width:24px;height:2px;background:var(--blue-bright);flex-shrink:0}
    .st{font-size:clamp(36px,4.5vw,60px);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-1px;color:var(--gray);margin-bottom:24px}
    .st.lt{color:var(--white)}
    .sb{font-size:17px;font-weight:300;color:#64748B;line-height:1.8;max-width:640px;margin-bottom:48px}

    /* PORTFOLIO */
    #portfolio{background:var(--dark)}
    .port-card{background:rgba(255,255,255,.03);border:1px solid rgba(37,99,235,.15);overflow:hidden;transition:all .3s}
    .port-card:hover{border-color:rgba(37,99,235,.4);box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .port-preview{height:260px;background:var(--steel);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;position:relative;border-bottom:1px solid rgba(37,99,235,.15)}
    .port-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-glow))}
    .port-tag{position:absolute;top:16px;left:16px;background:var(--blue);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--white);padding:5px 14px}
    .port-name{font-size:28px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--white)}
    .port-meta{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
    .port-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .port-pill{background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);color:var(--blue-glow);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 12px}
    .port-info{padding:32px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .port-desc{font-size:14px;color:var(--silver);line-height:1.65;max-width:560px}
    .port-link{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-glow);text-decoration:none;white-space:nowrap;transition:gap .2s}
    .port-link:hover{gap:12px}

    #process{background:var(--light)}
    .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:64px}
    .pc{background:var(--white);padding:48px 32px;position:relative;transition:all .3s;overflow:hidden}
    .pc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-glow));transform:scaleX(0);transform-origin:left;transition:transform .4s}
    .pc:hover{transform:translateY(-8px);box-shadow:0 20px 60px rgba(37,99,235,.12)}
    .pc:hover::before{transform:scaleX(1)}
    .pnum{font-size:64px;font-weight:900;color:rgba(37,99,235,.1);line-height:1;margin-bottom:20px}
    .pc h3{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:12px}
    .pc p{font-size:14px;color:#64748B;line-height:1.7}

    #work{background:var(--dark)}
    .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:64px}
    .wc{background:rgba(255,255,255,.03);padding:44px 36px;border:1px solid rgba(37,99,235,.12);transition:all .3s;position:relative;overflow:hidden}
    .wc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-glow));transform:scaleX(0);transition:transform .4s}
    .wc:hover{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.3);transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .wc:hover::after{transform:scaleX(1)}
    .wi{width:56px;height:56px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.2);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:24px}
    .wt{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--white);margin-bottom:12px}
    .wb{font-size:14px;color:var(--silver);line-height:1.7;margin-bottom:20px}
    .wlist{list-style:none;display:flex;flex-direction:column;gap:8px}
    .wlist li{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
    .wlist li::before{content:'';width:5px;height:5px;background:var(--blue-bright);border-radius:50%;flex-shrink:0;box-shadow:0 0 4px var(--blue-bright)}

    #pricing{background:var(--black);position:relative;overflow:hidden}
    #pricing::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(37,99,235,.08) 0%,transparent 65%);pointer-events:none}
    .prgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:64px;position:relative;z-index:1}
    .prc{background:rgba(255,255,255,.03);padding:52px 40px;border:1px solid rgba(255,255,255,.06);transition:all .3s;display:flex;flex-direction:column}
    .prc:not(.feat):hover{transform:translateY(-6px);border-color:rgba(37,99,235,.3);box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .prc.feat{background:var(--blue);border-color:var(--blue);box-shadow:0 0 60px rgba(37,99,235,.3)}
    .pbadge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue-glow);background:rgba(37,99,235,.15);padding:5px 14px;margin-bottom:28px;border:1px solid rgba(37,99,235,.3)}
    .pbadge.f{color:var(--white);background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
    .prname{font-size:26px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--white);margin-bottom:12px}
    .pram{font-size:68px;font-weight:900;line-height:1;color:var(--white);margin-bottom:6px;letter-spacing:-2px}
    .prsup{font-size:28px;vertical-align:top;margin-top:10px;display:inline-block}
    .prnote{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:16px;letter-spacing:1px;text-transform:uppercase}
    .prwhy{font-size:13px;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:28px;padding:14px;background:rgba(255,255,255,.04);border-left:2px solid rgba(37,99,235,.5)}
    .prc.feat .prwhy{background:rgba(0,0,0,.15);border-left-color:rgba(255,255,255,.4)}
    .prdiv{height:1px;background:rgba(255,255,255,.08);margin-bottom:32px}
    .prdiv.f{background:rgba(255,255,255,.2)}
    .prft{list-style:none;margin-bottom:44px;flex-grow:1}
    .prft li{font-size:14px;color:rgba(255,255,255,.75);padding:10px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.04)}
    .prft li::before{content:'';width:6px;height:6px;background:var(--blue-bright);border-radius:50%;flex-shrink:0;box-shadow:0 0 6px var(--blue-bright)}
    .prc.feat .prft li::before{background:rgba(255,255,255,.8);box-shadow:none}
    .prbtn{display:block;width:100%;text-align:center;font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:18px;text-decoration:none;background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.2);transition:all .25s;cursor:pointer;font-family:inherit}
    .prbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
    .prbtn.f{background:var(--black);border-color:var(--black)}
    .prbtn.f:hover{background:var(--steel)}
    .guar-line{display:block;text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,.3);margin-top:14px;text-transform:uppercase;letter-spacing:1px}
    .retainer-box{background:rgba(255,255,255,.03);border:1px solid rgba(37,99,235,.2);padding:40px;margin-top:2px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;position:relative;z-index:1}
    .retainer-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--blue-glow);margin-bottom:8px}
    .retainer-name{font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--white);margin-bottom:8px}
    .retainer-desc{font-size:14px;color:var(--silver);line-height:1.65;max-width:560px;margin-bottom:16px}
    .retainer-link{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-glow);text-decoration:none;border-bottom:1px solid rgba(96,165,250,.3);padding-bottom:2px}
    .retainer-price{text-align:right;flex-shrink:0}
    .retainer-amount{font-size:52px;font-weight:900;color:var(--white);line-height:1;letter-spacing:-2px}
    .retainer-mo{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:6px}

    #about{background:var(--light)}
    .abgrid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
    .abbox{background:var(--dark);padding:64px 56px;position:relative;overflow:hidden}
    .abbox::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(37,99,235,.15) 0%,transparent 65%)}
    .abbox::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-glow))}
    .abq{font-size:34px;font-weight:900;line-height:1.05;color:var(--white);text-transform:uppercase;margin-bottom:24px;position:relative;z-index:1;letter-spacing:-1px}
    .abq em{font-style:normal;background:linear-gradient(135deg,var(--blue-bright),var(--blue-glow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .abs{font-size:14px;color:var(--silver);line-height:1.75;position:relative;z-index:1}
    .abtag{position:absolute;bottom:0;right:0;background:var(--blue);padding:12px 20px;z-index:2}
    .abtag p{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--white)}
    .abpts{margin-top:44px}
    .abpt{display:flex;gap:20px;padding:22px 0;border-bottom:1px solid rgba(30,41,59,.08)}
    .abpt:last-child{border-bottom:none}
    .abico{width:44px;height:44px;background:var(--white);border:1px solid rgba(37,99,235,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .abpt h4{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:6px}
    .abpt p{font-size:14px;color:#64748B;line-height:1.65}

    #contact{background:var(--steel);position:relative;overflow:hidden}
    #contact::before{content:'';position:absolute;bottom:-200px;right:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,.1) 0%,transparent 65%);pointer-events:none}
    .ctgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:80px;align-items:start;margin-top:64px;position:relative;z-index:1}
    .ctl h3{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--white);margin-bottom:32px}
    .cdet{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
    .cdico{width:44px;height:44px;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.25);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .cdlbl{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue-glow);margin-bottom:4px}
    .cdval{font-size:15px;font-weight:500;color:var(--white)}
    .cdval a{color:var(--white);text-decoration:none}
    .cdval a:hover{color:var(--blue-glow)}
    .free-box{margin-top:40px;padding:28px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.25)}
    .free-box h4{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--white);margin-bottom:10px}
    .free-box
